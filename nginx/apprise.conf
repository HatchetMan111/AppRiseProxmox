# Apprise API – Nginx-Front (:8000) vor Gunicorn (127.0.0.1:8001).
#
# Warum: Django selbst hat keine /s/-Route (siehe Upstream urls.py) –
# Static (CSS/JS/Icons aus apprise_api/static) liefert Upstream per Nginx
# (nginx.conf Block 9, /usr/share/nginx/html/s). Ohne diesen Layer lädt
# die Web-UI ungestylt (riesige Icons, tote Buttons).
server {
    listen 8000;
    listen [::]:8000;
    server_name _;

    client_max_body_size 500M;

    # Static content: /s/ -> Upstream apprise_api/static/
    location /s/ {
        alias /opt/apprise-api/apprise_api/static/;
        expires 7d;
        access_log off;
    }

    location = /favicon.ico {
        alias /opt/apprise-api/apprise_api/static/favicon.ico;
        access_log off;
        log_not_found off;
    }

    # Alles andere -> Gunicorn (nur localhost)
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
}
